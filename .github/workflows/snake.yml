name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: sanskarRaghuvanshi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300fff2&color_dots=%23151515,%23202020,%2300403d,%23008078,%2300c0b5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300fff2

      - name: Publish snake files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}